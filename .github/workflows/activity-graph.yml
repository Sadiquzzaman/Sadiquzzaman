name: Update activity graph

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 06:17 Dhaka time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity_graph.py
      - .github/workflows/activity-graph.yml

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/activity_graph.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet || (git commit -m "Update activity graph" && git push)
